<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Meu hub</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- tela de login — escondida por padrão via CSS (#loginGate), auth.js
     mostra/esconde na inicialização. Ver auth.js pra ativar de verdade. -->
<div id="loginGate">
  <img src="icon-192.png" alt="" width="56" height="56">
  <h1>Meu hub</h1>
  <p>Faça login com sua conta do Google pra continuar.</p>
  <div id="g_id_signin_btn"></div>
</div>

<div id="shell">
  <!-- fundo escuro atrás do menu quando aberto em telas estreitas (celular);
       clicar nele fecha o menu — ver app.js. Fica invisível/sem clique em
       telas largas (o menu já convive lado a lado com o conteúdo). -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header" id="sidebarTitle">Meu hub</div>
    <div class="sidebar-search">
      <div class="search-field-wrap">
        <i class="ti ti-search"></i>
        <input class="sidebar-search-input js-search-input" placeholder="Buscar" autocomplete="off">
        <span class="kbd-hint">Ctrl K</span>
      </div>
    </div>
    <nav class="tree" id="tree"></nav>
  </aside>

  <div class="main">
    <header class="main-header">
      <!-- visível em QUALQUER tamanho de tela (diferente do back-btn, que só
           aparece no celular) — mostra/recolhe o menu lateral; no celular o
           menu hoje some sem isso, sem jeito nenhum de abrir. -->
      <button class="menu-toggle-btn" id="menuToggleBtn" aria-label="Mostrar/recolher menu"><i class="ti ti-menu-2"></i></button>
      <button class="back-btn mobile-only" id="backBtn" aria-label="Voltar"><i class="ti ti-chevron-left"></i></button>
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="header-search">
        <div class="search-field-wrap">
          <i class="ti ti-search"></i>
          <input class="header-search-input js-search-input" placeholder="Buscar" autocomplete="off">
        </div>
      </div>
      <div class="auth-user" id="authUser">
        <span id="authUserLabel"></span>
        <button type="button" id="authSignOutBtn">Sair</button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div class="search-results" id="searchResults"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="auth.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
