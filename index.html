<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Meu hub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header" id="sidebarTitle">Meu hub</div>
    <div class="sidebar-search">
      <div class="search-field-wrap">
        <i class="ti ti-search"></i>
        <input class="sidebar-search-input js-search-input" placeholder="Buscar" autocomplete="off">
        <span class="kbd-hint">Ctrl K</span>
      </div>
    </div>
    <nav class="tree" id="tree"></nav>
  </aside>

  <div class="main">
    <header class="main-header">
      <button class="back-btn mobile-only" id="backBtn" aria-label="Voltar"><i class="ti ti-chevron-left"></i></button>
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="header-search">
        <div class="search-field-wrap">
          <i class="ti ti-search"></i>
          <input class="header-search-input js-search-input" placeholder="Buscar" autocomplete="off">
        </div>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div class="search-results" id="searchResults"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
