<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Meu hub</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- tela de login — escondida por padrão via CSS (#loginGate), auth.js
     mostra/esconde na inicialização. Ver auth.js pra ativar de verdade. -->
<div id="loginGate">
  <img src="icon-192.png" alt="" width="56" height="56">
  <h1>Meu hub</h1>
  <p>Faça login com sua conta do Google pra continuar.</p>
  <div id="g_id_signin_btn"></div>
</div>

<div id="shell">
  <!-- fundo escuro atrás do menu quando aberto em telas estreitas (celular);
       clicar nele fecha o menu — ver app.js. Fica invisível/sem clique em
       telas largas (o menu já convive lado a lado com o conteúdo). -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header" id="sidebarTitle">Meu hub</div>
    <div class="sidebar-search">
      <div class="search-field-wrap">
        <i class="ti ti-search"></i>
        <input class="sidebar-search-input js-search-input" placeholder="Buscar" autocomplete="off">
        <span class="kbd-hint">Ctrl K</span>
      </div>
    </div>
    <nav class="tree" id="tree"></nav>
  </aside>

  <div class="main">
    <header class="main-header">
      <!-- visível em QUALQUER tamanho de tela (diferente do back-btn, que só
           aparece no celular) — mostra/recolhe o menu lateral; no celular o
           menu hoje some sem isso, sem jeito nenhum de abrir. -->
      <button class="menu-toggle-btn" id="menuToggleBtn" aria-label="Mostrar/recolher menu"><i class="ti ti-menu-2"></i></button>
      <button class="back-btn mobile-only" id="backBtn" aria-label="Voltar"><i class="ti ti-chevron-left"></i></button>
      <div class="breadcrumb" id="breadcrumb"></div>
      <!-- "página inicial configurável" (pedido do Georges): define a página
           ATUAL como a que abre primeiro quando o app é aberto — fica
           preenchido/destacado quando a página aberta já é a home (ver
           updateSetHomeBtn em app.js, chamado a cada render(pageId)). -->
      <button class="set-home-btn" id="setHomeBtn" type="button" title="Definir como página inicial"><i class="ti ti-home"></i></button>
      <!-- Central de Notificações (pedido do Georges): sino GLOBAL, visível em
           QUALQUER página (diferente do sidePanel abaixo, que só aparece em
           páginas com page.sidePanel configurado) — abre o painel notifPanel,
           que desliza da DIREITA (espelho do menu esquerdo). Bolinha vermelha
           (id="notifBellBadge") só aparece quando tem aviso não lido — ver
           refreshNotifications()/toggleNotifPanel() em app.js. -->
      <button class="notif-bell-btn" id="notifBellBtn" type="button" title="Central de notificações" aria-label="Central de notificações" aria-expanded="false">
        <i class="ti ti-bell"></i>
        <span class="notif-bell-badge" id="notifBellBadge" style="display:none"></span>
      </button>
      <div class="header-search">
        <div class="search-field-wrap">
          <i class="ti ti-search"></i>
          <input class="header-search-input js-search-input" placeholder="Buscar" autocomplete="off">
        </div>
      </div>
      <div class="auth-user" id="authUser">
        <span id="authUserLabel"></span>
        <button type="button" id="authSignOutBtn">Sair</button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- painel retrátil do lado direito (só aparece em páginas com
     page.sidePanel configurado — hoje só "Início"): aba discreta fixa na
     borda + painel que desliza da direita, ambos escondidos por padrão via
     CSS/JS — ver renderSidePanel() em app.js. Fundo escuro atrás do painel
     quando aberto em telas estreitas (celular); clicar nele fecha o painel
     — igual ao sidebarBackdrop do menu esquerdo, acima. Só aparece (via
     CSS) em telas estreitas — em telas largas o painel já convive lado a
     lado com o conteúdo, sem precisar de fundo escuro. -->
<div class="side-panel-backdrop" id="sidePanelBackdrop"></div>
<button class="side-panel-tab" id="sidePanelTab" aria-label="Mostrar atalhos" aria-expanded="false" style="display:none">
  <i class="ti ti-chevron-left" aria-hidden="true"></i>
</button>
<aside class="side-panel" id="sidePanel" aria-hidden="true" style="display:none"></aside>

<!-- Central de Notificações (pedido do Georges) — gaveta PRÓPRIA, dedicada
     (não reaproveita o side-panel acima, que é uma feature diferente —
     atalhos por página, hoje só em Início): mesma dinâmica de "abre sem
     usar a tela toda, fecha clicando fora" do menu esquerdo (sidebar +
     sidebarBackdrop, no topo deste arquivo), só que espelhada — desliza da
     DIREITA e é acionada pelo sino global (notifBellBtn), não por página.
     Ver renderNotifPanel()/toggleNotifPanel() em app.js. -->
<div class="notif-backdrop" id="notifBackdrop"></div>
<aside class="notif-panel" id="notifPanel" aria-hidden="true">
  <div class="notif-panel-header">
    <span class="notif-panel-title">Notificações</span>
    <div class="notif-panel-tabs" id="notifPanelTabs">
      <button type="button" class="notif-panel-tab-btn active" data-mode="unread">Não lidas</button>
      <button type="button" class="notif-panel-tab-btn" data-mode="all">Todas</button>
    </div>
    <!-- gestão (pedido do Georges: "gestão do que vai ter notificação e
         quando") — alterna a lista pro editor por fonte (liga/desliga +
         antecedências), dentro do MESMO painel/id="notifPanelList" (ver
         toggleNotifSettingsView/renderNotifSettings em app.js). -->
    <button type="button" class="notif-panel-settings-btn" id="notifPanelSettingsBtn" title="Gerenciar notificações" aria-label="Gerenciar notificações"><i class="ti ti-settings"></i></button>
    <button type="button" class="notif-panel-close-btn" id="notifPanelCloseBtn" aria-label="Fechar notificações"><i class="ti ti-x"></i></button>
  </div>
  <div class="notif-panel-list" id="notifPanelList"></div>
</aside>

<div class="search-results" id="searchResults"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="auth.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
